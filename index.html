<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Armiro Caça Moedas</title>
<style>:root{--ac:#ffc400}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1030;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;overflow-y:auto;background:radial-gradient(120% 80% at 50% 0%,#3a2a8c 0%,#171a4a 45%,#0a0c26 100%);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
#fl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#fl i{position:absolute;bottom:-50px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3a0,#f5c518 60%,#b8860b);opacity:.55;animation:fl linear infinite}
@keyframes fl{to{bottom:110%;rotate:360deg}}
.wrap{position:relative;margin:auto;width:min(100%,380px);text-align:center}
.av{display:flex;justify-content:center;align-items:flex-end;margin-bottom:8px}
.av img{width:84px;height:118px;object-fit:cover;border-radius:50%/45%;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 4px var(--ac);background:#fff}
.av img+img{width:66px;height:92px;margin-left:-8px;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 3px #2cc36b}
#t{margin:8px 0 6px;font-size:40px;line-height:.95;font-weight:400;background:linear-gradient(#fff6b0,#ffc400 60%,#ff9500);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b3d00)}
#t small{display:block;font-size:17px;letter-spacing:.4em;margin-bottom:4px}
.card{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:20px;padding:12px 14px;margin:14px 0;text-align:left;backdrop-filter:blur(8px);font-family:system-ui,sans-serif;font-size:15px}
.r{display:flex;align-items:center;gap:12px;padding:7px 0}.r+.r{border-top:1px solid rgba(255,255,255,.1)}
.r b{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.14);font-size:20px}.r span{line-height:1.25}
#b{width:100%;border:0;border-radius:18px;padding:16px;font:inherit;font-size:26px;letter-spacing:.06em;color:#3a2300;background:linear-gradient(#ffe066,#ffb300);box-shadow:0 6px 0 #b36b00,0 14px 24px rgba(0,0,0,.4);animation:pl 1.6s ease-in-out infinite}
#b:active{transform:translateY(4px);box-shadow:0 2px 0 #b36b00}@keyframes pl{50%{transform:scale(1.04)}}
.hint{font-family:system-ui,sans-serif;font-size:12.5px;opacity:.65;margin:14px 0 4px}
#rec{display:inline-block;margin-top:4px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.1);font-size:15px}
.st{display:flex;gap:10px}.st div{flex:1;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 4px;text-align:center}.st b{display:block;font-size:28px;color:var(--ac);font-weight:400}.st span{font-size:11px;opacity:.7;font-family:system-ui}
#mu{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:rgba(15,18,40,.72);font-size:20px;color:#fff;padding:0;z-index:3}</style><link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet"></head><body>
